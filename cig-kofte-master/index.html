<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="object-src 'none'; base-uri 'self'; form-action 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2a110c">
<title>Çiğ Köfte Master</title>
<link rel="icon" href="TemplateData/icon.png">
<link rel="manifest" href="TemplateData/manifest.webmanifest">
<link rel="apple-touch-icon" href="TemplateData/icon-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Çiğ Köfte">
<style>
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#2a110c;touch-action:none;-webkit-user-select:none;user-select:none}
#unity-canvas{position:fixed;inset:0;width:100%;height:100%;display:block;background:#2a110c;outline:none}
#ck-loader{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:radial-gradient(circle at 50% 40%,#5a2416 0,#2a110c 70%);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#fde8cf;z-index:5;transition:opacity .4s}
#ck-loader img.logo{width:min(70vw,620px);height:auto;filter:drop-shadow(0 8px 18px rgba(0,0,0,.45))}
#ck-loader img.masc{position:absolute;left:6vw;bottom:6vh;width:min(18vw,150px);animation:bob 1.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-10px)}}
#ck-bar{width:min(70vw,520px);height:18px;border-radius:12px;background:rgba(255,255,255,.15);overflow:hidden}
#ck-fill{height:100%;width:2%;border-radius:12px;background:linear-gradient(90deg,#ffd45a,#ff8a2a);transition:width .2s}
#ck-msg{font-size:15px;opacity:.85;text-align:center;padding:0 16px}
#ck-rotate{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#2a110c;color:#fde8cf;font:600 18px system-ui,sans-serif;z-index:9;text-align:center;padding:20px}
#ck-rotate .ph{width:58px;height:96px;border:5px solid #fde8cf;border-radius:12px;animation:rot 1.6s ease-in-out infinite}
@keyframes rot{50%{transform:rotate(-90deg)}}
@media (orientation:portrait) and (max-width:900px){#ck-rotate{display:flex}}
#ck-back{position:fixed;left:10px;top:8px;z-index:6;color:#fde8cf;text-decoration:none;font:600 13px system-ui,sans-serif;background:rgba(0,0,0,.35);padding:6px 10px;border-radius:10px;opacity:.75}
#ck-back:hover{opacity:1}
#ck-err{display:none;max-width:560px;text-align:center;line-height:1.5}
#ck-ios{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:8;display:none;align-items:center;gap:12px;max-width:92vw;background:rgba(20,8,5,.92);color:#fde8cf;font:600 14px system-ui,sans-serif;padding:10px 12px 10px 16px;border-radius:14px;box-shadow:0 6px 20px rgba(0,0,0,.4)}
#ck-ios button{border:0;border-radius:10px;background:#ffc24a;color:#2a110c;font:700 14px system-ui,sans-serif;padding:8px 14px;cursor:pointer}
</style>

</head>
<body>
<canvas id="unity-canvas" tabindex="-1"></canvas>
<div id="ck-loader">
  <img class="logo" src="TemplateData/logo.png" alt="Çiğ Köfte Master">
  <div id="ck-bar"><div id="ck-fill"></div></div>
  <div id="ck-msg">Yükleniyor… / Loading…</div>
  <div id="ck-err">Oyun yüklenemedi. Sayfayı yenileyin. / The game could not load. Please refresh the page.</div>
  <img class="masc" src="TemplateData/mascot.png" alt="">
</div>
<div id="ck-rotate"><div class="ph"></div><div>Telefonu yan çevirin<br><small>Please rotate your device</small></div></div>
<div id="ck-ios" role="dialog" aria-live="polite"><span>Tam ekran için: Safari'de <b>Paylaş ⬆</b> → <b>Ana Ekrana Ekle</b>, sonra oyunu ana ekrandaki simgeden açın.</span><button id="ck-ios-ok" type="button">Tamam</button></div>
<a id="ck-back" href="/games/cig-kofte-master.html" aria-label="Tugrion">&#8592; tugrion.com</a>
<script>
(function(){
  var canvas=document.getElementById("unity-canvas");
  var fill=document.getElementById("ck-fill");
  var loader=document.getElementById("ck-loader");
  var mobile=/Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);
  var buildUrl="Build";
  var config={
    dataUrl: buildUrl + "/Web_tugrion.data.unityweb",
    frameworkUrl: buildUrl + "/Web_tugrion.framework.js.unityweb",
    codeUrl: buildUrl + "/Web_tugrion.wasm.unityweb",
    streamingAssetsUrl: "StreamingAssets",
    companyName: "Tugrion",
    productName: "Çiğ Köfte Master",
    productVersion: "1.0",
    devicePixelRatio: mobile ? Math.min(window.devicePixelRatio || 1, 2) : (window.devicePixelRatio || 1)
  };
  canvas.addEventListener("contextmenu",function(e){e.preventDefault();});
  // --- Telefonda TAM EKRAN: ilk dokunusta adres cubugu ve alt cubuk gizlenir, ekran yatay kilitlenir
  var ios=/iPhone|iPad|iPod/i.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
  var standalone=(window.navigator.standalone===true)||(window.matchMedia&&(matchMedia("(display-mode: fullscreen)").matches||matchMedia("(display-mode: standalone)").matches));
  var de=document.documentElement;
  var fsReq=de.requestFullscreen||de.webkitRequestFullscreen;
  function isFull(){return !!(document.fullscreenElement||document.webkitFullscreenElement);}
  function goFull(){
    if(!mobile||standalone||isFull()||!fsReq)return;
    try{
      var p=fsReq.call(de,{navigationUI:"hide"});
      var lock=function(){try{if(screen.orientation&&screen.orientation.lock)screen.orientation.lock("landscape")["catch"](function(){});}catch(e){}};
      if(p&&p.then)p.then(lock)["catch"](function(){});else lock();
    }catch(e){}
  }
  document.addEventListener("touchend",goFull,true);
  document.addEventListener("pointerup",goFull,true);
  // iPhone Safari tam ekrani desteklemiyor: bir kez "Ana Ekrana Ekle" ipucu goster
  if(ios&&!standalone&&!fsReq){
    var seen=false;try{seen=localStorage.getItem("ck_ios_hint")==="1";}catch(e){}
    if(!seen){var h=document.getElementById("ck-ios");h.style.display="flex";
      document.getElementById("ck-ios-ok").addEventListener("click",function(){h.style.display="none";try{localStorage.setItem("ck_ios_hint","1");}catch(e){}});}
  }
  window.addEventListener("keydown",function(e){ if([32,37,38,39,40,9].indexOf(e.keyCode)>=0) e.preventDefault(); },{passive:false});
  function fail(){ document.getElementById("ck-msg").style.display="none"; document.getElementById("ck-err").style.display="block"; }
  var s=document.createElement("script");
  s.src=buildUrl + "/Web_tugrion.loader.js";
  s.onerror=fail;
  s.onload=function(){
    Promise.resolve().then(function(){
      createUnityInstance(canvas, config, function(p){ fill.style.width=Math.max(2,Math.round(p*100))+"%"; })
      .then(function(inst){ window.unityInstance=inst; loader.style.opacity="0"; setTimeout(function(){loader.style.display="none";var b=document.getElementById("ck-back");if(b)b.style.display="none";},450); canvas.focus(); })
      .catch(function(m){ console.error(m); fail(); });
    });
  };
  document.body.appendChild(s);
})();
</script>
</body>
</html>
